name: Build ValeDouro Windows

on:
  push:
    branches:
      - windows-build
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows packages
        run: npm run build:win

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ValeDouro-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
